name: Build MNN for Android API 32 (Reduced Size)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MNN Source
        uses: actions/checkout@v4
        with:
          repository: alibaba/MNN
          path: MNN

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            android-ndk-r29
            OpenCV-android-sdk
          key: ${{ runner.os }}-mnn-android-ndk29-opencv4.13.0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build wget unzip

      - name: Download Android NDK r29
        run: |
          if [ ! -d android-ndk-r29 ]; then
            wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
            echo "4abbbcdc842f3d4879206e9695d52709603e52dd68d3c1fff04b3b5e7a308ecf android-ndk-r29-linux.zip" | sha256sum -c
            unzip -q android-ndk-r29-linux.zip
          fi
          echo "ANDROID_NDK=$PWD/android-ndk-r29" >> $GITHUB_ENV

      - name: Download and Setup OpenCV 4.13.0
        run: |
          if [ ! -d OpenCV-android-sdk ]; then
            wget -q https://github.com/opencv/opencv/releases/download/4.13.0/opencv-4.13.0-android-sdk.zip
            unzip -q opencv-4.13.0-android-sdk.zip
          fi
          echo "OpenCV_DIR=$PWD/OpenCV-android-sdk/sdk/native/jni" >> $GITHUB_ENV

      - name: Configure CMake (Reduced Size)
        run: |
          mkdir -p build-arm64-v8a
          cd build-arm64-v8a
          cmake ../MNN \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-32 \
            -DANDROID_STL=c++_shared \
            -DMNN_USE_OPENCV=ON \
            -DMNN_BUILD_MINI=ON \
            -DMNN_DEBUG=OFF \
            -DMNN_BUILD_TOOLS=OFF \
            -DMNN_BUILD_DEMO=OFF \
            -DMNN_FORBID_MULTI_THREAD=ON \
            -DMNN_USE_THREAD_POOL=OFF \
            -DCMAKE_CXX_FLAGS="-s -Os --gc-sections"

      - name: Build MNN
        run: |
          cd build-arm64-v8a
          ninja

      - name: Package Library Only
        run: |
          mkdir -p output/lib
          cp build-arm64-v8a/*.so output/lib/
          cp -r MNN/include output/
          tar -cf - output | xz -9e -T0 > MNN-android-arm64-v8a.tar.xz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNN-android-api32-arm64-v8a
          path: MNN-android-arm64-v8a.tar.xz
