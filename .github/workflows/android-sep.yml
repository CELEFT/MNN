name: Build MNN for Android API 32 (Make + OpenCV)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MNN source
        uses: actions/checkout@v4
        with:
          repository: alibaba/MNN
          path: MNN

      - name: Install dependencies (downgrade CMake to 3.22.1)
        run: |
          sudo apt-get update
          sudo apt-get remove -y cmake
          wget -q https://github.com/Kitware/CMake/releases/download/v3.22.1/cmake-3.22.1-linux-x86_64.tar.gz
          tar -xzf cmake-3.22.1-linux-x86_64.tar.gz
          sudo cp -r cmake-3.22.1-linux-x86_64/bin/* /usr/local/bin/
          sudo cp -r cmake-3.22.1-linux-x86_64/share/* /usr/local/share/
          sudo apt-get install -y make opencl-headers xz-utils wget unzip

      - name: Download Android NDK r29
        run: |
          wget -q https://googledownloads.cn/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r29" >> $GITHUB_ENV

      - name: Download and Setup OpenCV 4.13.0
        run: |
          wget -q https://github.com/opencv/opencv/releases/download/4.13.0/opencv-4.13.0-android-sdk.zip
          unzip -q opencv-4.13.0-android-sdk.zip
          echo "OpenCV_DIR=$PWD/OpenCV-android-sdk/sdk/native/jni" >> $GITHUB_ENV

      - name: Configure CMake for arm64-v8a (using Make)
        run: |
          mkdir -p build-arm64-v8a
          cd build-arm64-v8a
          cmake ../MNN \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_STL=c++_shared \
            -DMNN_USE_LOGCAT=ON \
            -DMNN_USE_SSE=OFF \
            -DMNN_ARM82=ON \
            -DMNN_OPENCL=ON \
            -DMNN_VULKAN=ON \
            -DMNN_JNI=ON \
            -DMNN_SEP_BUILD=ON \
            -DMNN_BUILD_OPENCV=ON \
            -DMNN_IMGCODECS=ON \
            -DMNN_SUPPORT_BF16=ON \
            -DANDROID_NATIVE_API_LEVEL=android-32 \
            -DMNN_BUILD_FOR_ANDROID_COMMAND=ON \
            -DNATIVE_LIBRARY_OUTPUT=./lib \
            -DNATIVE_INCLUDE_OUTPUT=. \
            -DCMAKE_INSTALL_PREFIX=$PWD/install

      - name: Build MNN with Make
        run: |
          cd build-arm64-v8a
          make -j$(nproc)

      - name: Package entire build directory (with headers and libc++_shared.so)
        run: |
          cp -r MNN/include build-arm64-v8a/
          LIBCXX=$(find $ANDROID_NDK -name "libc++_shared.so" | grep "aarch64-linux-android" | head -n 1)
          if [ -n "$LIBCXX" ]; then
            mkdir -p build-arm64-v8a/lib
            cp "$LIBCXX" build-arm64-v8a/lib/
          fi
          tar -cf - build-arm64-v8a | xz -9e -T2 > MNN-android-api32-arm64-v8a.tar.xz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNN-android-api32-arm64-v8a
          path: MNN-android-api32-arm64-v8a.tar.xz
