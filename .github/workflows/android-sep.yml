name: Build MNN for Android API 32

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MNN source
        uses: actions/checkout@v4
        with:
          repository: alibaba/MNN
          path: MNN

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build opencl-headers xz-utils wget unzip

      - name: Download Android NDK r29
        run: |
          wget -q https://googledownloads.cn/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r29" >> $GITHUB_ENV

      - name: Download and Setup OpenCV 4.13.0
        run: |
          wget -q https://github.com/opencv/opencv/releases/download/4.13.0/opencv-4.13.0-android-sdk.zip
          unzip -q opencv-4.13.0-android-sdk.zip
          echo "OpenCV_DIR=$PWD/OpenCV-android-sdk/sdk/native/jni" >> $GITHUB_ENV

      - name: Configure CMake for arm64-v8a (Optimized Size + OpenCV + Multi-thread)
        run: |
          mkdir -p build-arm64-v8a
          cd build-arm64-v8a
          CMAKE_ARGS=(
            -G Ninja
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake
            -DANDROID_ABI=arm64-v8a
            -DANDROID_PLATFORM=android-32
            -DANDROID_STL=c++_shared
            -DCMAKE_BUILD_TYPE=MinSizeRel
            -DMNN_USE_OPENCV=ON
            -DMNN_OPENCL=ON
            -DMNN_VULKAN=ON
            -DMNN_ARM82=ON
            -DMNN_SUPPORT_BF16=ON
            -DMNN_BUILD_SHARED_LIBS=ON
            -DMNN_SEP_BUILD=ON
            -DMNN_BUILD_MINI=OFF
            -DCMAKE_INSTALL_PREFIX=$PWD/install
          )
          cmake "${CMAKE_ARGS[@]}" ../MNN

      - name: Build MNN
        run: |
          cd build-arm64-v8a
          ninja

      - name: Install to staging directory (including headers)
        run: |
          cd build-arm64-v8a
          ninja install

      - name: Package install directory
        run: |
          tar -cf - -C build-arm64-v8a/install | xz -9e -T0 > MNN-android-arm64-v8a-install.tar.xz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNN-android-arm64-v8a-install
          path: MNN-android-arm64-v8a-install.tar.xz
